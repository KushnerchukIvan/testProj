<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>прапори</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        .flag{
            width: 300px;
            position: relative;
        }
        .ukraine{
            height: 200px;
            background: linear-gradient(to bottom, blue 50%, yellow 50%);
        }
        .japan{
            height: 200px;
            background: white;
            border: 1px solid black;
        }
        .japan::before{
            content: "";
            width: 120px;
            height: 120px;
            background: red;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div class="flag ukraine"></div>
    <div class="flag japan"></div>
</body>
</html>
