<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task 2</title>
    <style>
        .gallery {
            width: 80%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .gallery img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #444;
            transition: 0.4s;
        }
        .image-card:nth-child(4n + 1) img {
            border-color: red;
        }
        .gallery img:hover {
            border-color: yellow;
            transform: rotate(45deg);
        }
        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="info" id="info"></div>
    <div class="gallery">
        <div class="image-card">
            <img src="photos/1.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/2.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/3.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/4.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/5.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/6.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/7.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/8.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/9.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/10.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/11.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/12.jpg" alt="">
        </div>
    </div>

    <div class="modal" id="modal">
    <span class="close-btn" id="closeBtn">
        ×
    </span>
    <img id="modalImage" src="" alt="">
    </div>
</body>
<script>
    const images = document.querySelectorAll('.gallery img');
    const info = document.getElementById('info');
    const now = new Date();
    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const year = now.getFullYear();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    info.innerHTML = `
        Кількість зображень: ${images.length}
        <br>
        ${day}.${month}.${year} ${hours}:${minutes}
    `;
    
    const modal = document.getElementById('modal');
    const modalImage = document.getElementById('modalImage');
    images.forEach(image => {
        image.addEventListener('click', () => {
            modal.style.display = 'flex';
            modalImage.src = image.src;
        });
    });
</script>
</body>
</html>
