<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task 2</title>
    <style>
        .gallery {
            width: 80%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .gallery img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #444;
            transition: 0.4s;
        }
        .image-card:nth-child(4n + 1) img {
            border-color: red;
        }
        .gallery img:hover {
            border-color: yellow;
            transform: rotate(45deg);
        }
    </style>
</head>
<body>
    <div class="info" id="info"></div>
    <div class="gallery">
        <div class="image-card">
            <img src="photos/1.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/2.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/3.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/4.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/5.jpg" alt="">
        </div>
        <div class="image-card">

        </div>
        <div class="image-card">
            <img src="photos/7.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/8.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/9.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/10.jpg" alt="">

        <div class="image-card">
            <img src="photos/11.jpg" alt="">
        </div>
        <div class="image-card">
            <img src="photos/12.jpg" alt="">
        </div>
    </div>
</body>
</body>
</html>
